<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>12 недель</title>
<meta name="theme-color" content="#07070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12 недель">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#07070D;--bg2:#050509;--s1:rgba(22,20,34,.62);--s2:rgba(255,255,255,.045);--s3:rgba(255,255,255,.08);
  --tx:#F2EDE2;--mut:rgba(242,237,226,.58);--dim:rgba(242,237,226,.34);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --p:#9B6FE8;--pb:#C4A4FF;--pd:#5B2FBE;--pm:#7C4FD4;--c:#00C4D4;--cb:#5EE0EE;--cd:#007A8C;
  --glow:0 0 18px rgba(155,111,232,.55),0 0 46px rgba(155,111,232,.28);
  --glowc:0 0 16px rgba(0,196,212,.5),0 0 40px rgba(0,196,212,.22);
  --mono:'DM Mono',ui-monospace,Menlo,monospace;--r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;padding-top:env(safe-area-inset-top);background:
  radial-gradient(900px 520px at 85% -10%,rgba(91,47,190,.32),transparent 60%),
  radial-gradient(700px 500px at -10% 40%,rgba(124,79,212,.16),transparent 60%),
  radial-gradient(600px 400px at 60% 110%,rgba(0,122,140,.14),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx);background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;width:100%;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 2px 8px rgba(0,0,0,.35);transition:.2s}
input:focus,textarea:focus,select:focus{border-color:rgba(196,164,255,.7);box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 0 3px rgba(155,111,232,.18),var(--glow)}
textarea{min-height:76px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:2px 0 10px}
.logo{font-weight:900;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.logo b{color:var(--pb);text-shadow:0 0 12px rgba(196,164,255,.8)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:linear-gradient(160deg,#D9C6FF,#9B6FE8 55%,#5B2FBE);color:#0B0614;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.5)}
.ava.lg{width:72px;height:72px;font-size:28px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--mut);flex:none;background:var(--s2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.h1{font-weight:900;text-transform:uppercase;letter-spacing:-1.5px;line-height:.92;font-size:clamp(34px,9vw,52px);margin:6px 0 0;
  background:linear-gradient(180deg,#FFFFFF 0%,#E8DFFF 35%,#C4A4FF 70%,#9B6FE8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(155,111,232,.35))}
.h2{font-weight:900;text-transform:uppercase;letter-spacing:-.5px;font-size:20px;margin:0}
/* стекло */
.card,.tk,.hb,.sheet,.nav .in,.kv div,.stat div{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 40%,rgba(255,255,255,.0) 70%),var(--s1);
  border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.45)}
.card{border-radius:var(--r);padding:16px;margin:12px 0}
.card::before,.hb::before,.tk::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 35%,rgba(155,111,232,.08) 70%,rgba(255,255,255,.14));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.kv div,.stat div{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.3);backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01)),rgba(0,0,0,.22)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;border:1px solid var(--line2);font-weight:700;font-size:14px;background:var(--s2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.3);transition:.2s}
.btn:active{transform:translateY(1px)}
.btn.pr{background:linear-gradient(180deg,#B48BFF,#8E5DE6 60%,#6F3FD6);border-color:rgba(255,255,255,.35);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(60,20,140,.6)}
.btn.gh{color:var(--mut);background:transparent;box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.del{color:var(--pb);border-color:rgba(196,164,255,.3)}
.btn.w{width:100%}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative;filter:drop-shadow(0 0 14px rgba(155,111,232,.45))}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:30px;font-weight:900;letter-spacing:-1px;display:block;line-height:1}
.ring .v span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mut)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{padding:10px;min-width:0;overflow:hidden}
.kv b{display:block;font-size:20px;font-weight:900}
.kv span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.daynav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);color:var(--mut);background:var(--s2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.daynav .d{text-align:center;width:auto;height:auto;border:0;background:none;box-shadow:none;padding:4px 10px;border-radius:12px}
.daynav .d b{display:block;font-size:17px}
.gh3{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.tk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin:8px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 22px rgba(0,0,0,.35)}
.tk.done{border-color:rgba(0,196,212,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(0,196,212,.12),0 0 26px rgba(0,196,212,.14),0 8px 22px rgba(0,0,0,.35)}
.tk .t{flex:1;min-width:0}
.tk .t b{font-weight:500;display:block}
.tk .t .meta{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.04em;margin-top:2px}
.tk .t .hint{font-size:12px;color:var(--pb);margin-top:4px}
.chk{width:36px;height:36px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;background:rgba(0,0,0,.25);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.06);transition:.2s}
.chk.on{background:linear-gradient(180deg,#7FEBF5,#00C4D4 60%,#009BAB);border-color:rgba(255,255,255,.4);color:#03181C;box-shadow:var(--glowc),inset 0 1px 0 rgba(255,255,255,.6)}
.step{display:flex;align-items:center;border:1px solid var(--line2);border-radius:12px;overflow:hidden;flex:none;background:rgba(0,0,0,.25);box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.step button{width:32px;height:36px;color:var(--mut);font-size:18px}
.step input{width:46px;border:0;border-radius:0;background:transparent;text-align:center;padding:6px 0;font-weight:700;box-shadow:none}
.bar{height:5px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden;margin-top:7px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pd),var(--p),var(--pb));border-radius:5px;box-shadow:0 0 10px rgba(155,111,232,.8)}
.bar.c i{background:linear-gradient(90deg,var(--cd),var(--c),var(--cb));box-shadow:0 0 10px rgba(0,196,212,.8)}
.grid{width:100%;border-collapse:collapse;font-size:13px}
.grid th,.grid td{padding:6px 1px;border-bottom:1px solid var(--line);text-align:center}
.grid th{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--mut)}
.grid td:first-child,.grid th:first-child{text-align:left;padding-left:0}
.grid td.nm{font-size:12px;line-height:1.25;padding-right:6px;word-break:break-word}
.grid .cell{width:24px;height:24px;border-radius:8px;display:inline-grid;place-items:center;background:rgba(0,0,0,.3);font-size:11px;font-weight:700;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.grid .cell.on{background:linear-gradient(180deg,#7FEBF5,#00B5C4);color:#03181C;box-shadow:0 0 12px rgba(0,196,212,.6)}
.grid .cell.part{background:rgba(155,111,232,.4);box-shadow:0 0 10px rgba(155,111,232,.4)}
.grid .cell.today{outline:1.5px solid var(--pb)}
.ok{color:var(--cb)}.no{color:var(--dim)}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;background:var(--s2)}
.pill.p{border-color:rgba(196,164,255,.5);color:var(--pb);box-shadow:0 0 12px rgba(155,111,232,.25)}
.pill.c{border-color:rgba(0,196,212,.5);color:var(--cb);box-shadow:0 0 12px rgba(0,196,212,.25)}
.hm{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:4px;background:rgba(0,0,0,.3);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.f{margin:12px 0}
.f label{display:block;margin-bottom:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(3,3,8,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{border-radius:26px 26px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 40%),rgba(16,14,26,.92)}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:26px}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,18,32,.9);border:1px solid rgba(196,164,255,.35);padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:60;font-size:14px;pointer-events:none;white-space:nowrap;box-shadow:var(--glow);backdrop-filter:blur(12px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.fun{display:grid;gap:6px}
.fun .st{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.fun .st .b{height:22px;border-radius:7px;background:linear-gradient(90deg,var(--pd),var(--p),var(--pb));box-shadow:0 0 14px rgba(155,111,232,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.empty{text-align:center;padding:24px 10px;color:var(--mut)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:12px;border:1px solid var(--line2);font-size:13px;color:var(--mut);background:var(--s2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:.2s}
.seg button.on{border-color:rgba(196,164,255,.6);color:#fff;background:linear-gradient(180deg,rgba(155,111,232,.45),rgba(91,47,190,.45));box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.quote{border-left:2px solid var(--p);padding:4px 0 4px 12px;color:var(--mut);font-size:14px;box-shadow:-6px 0 14px -8px rgba(155,111,232,.8)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
a{color:var(--pb)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--pb)}details[open]>summary::before{content:"▾ "}
/* нижнее меню — парящее стекло */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:720px;margin:0 auto;display:flex;align-items:stretch;gap:4px;border-radius:24px;padding:6px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 50%),rgba(14,12,24,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.6)}
.nav button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 4px;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.01em;border-radius:18px;transition:background .2s,color .2s;white-space:nowrap}
.nav button span{display:none}
.nav button.on{flex:0 0 auto;padding:0 16px 0 14px;color:#fff;background:linear-gradient(180deg,rgba(155,111,232,.42),rgba(91,47,190,.36));box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.nav button.on span{display:inline}
.nav button svg{width:22px;height:22px;flex:none}
@media(min-width:560px){.nav button span{display:inline}.nav button{padding:0 10px}.nav button.on{flex:1 1 0}}
.nav button.on svg{color:#fff;filter:drop-shadow(0 0 6px rgba(196,164,255,.9))}
/* привычки */
.hb{border-radius:18px;padding:12px 14px;margin:8px 0}
.hb .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.hb .days button{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.hb .days i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;background:rgba(0,0,0,.25);box-shadow:inset 0 2px 5px rgba(0,0,0,.4);transition:.2s}
.hb .days i.on{background:linear-gradient(180deg,#7FEBF5,#00C4D4 60%,#009BAB);border-color:rgba(255,255,255,.4);color:#03181C;box-shadow:var(--glowc),inset 0 1px 0 rgba(255,255,255,.6)}
.hb .days i.off{border-style:dashed;opacity:.35}
.hb .days .td{color:var(--tx)}
.streak{font-family:var(--mono);font-size:11px;color:var(--cb);letter-spacing:.06em;text-shadow:0 0 10px rgba(94,224,238,.6)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal span{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center}
.cal button{aspect-ratio:1;border-radius:10px;background:rgba(0,0,0,.3);font-size:12px;color:var(--mut);box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.cal button.on{background:linear-gradient(180deg,#7FEBF5,#00B5C4);color:#03181C;font-weight:700;box-shadow:0 0 14px rgba(0,196,212,.55)}
.cal button.x{opacity:.25}
.cal button.td{outline:1.5px solid var(--pb)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.tabs2 button{padding:9px;border-radius:11px;color:var(--mut);font-weight:700;font-size:14px}
.tabs2 button.on{background:linear-gradient(180deg,rgba(155,111,232,.5),rgba(91,47,190,.5));color:#fff;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{padding:12px}
.stat b{font-size:22px;font-weight:900;display:block}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.cloud{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cloud i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.cloud.on i{background:var(--c);box-shadow:0 0 10px var(--c)}
.cloud.err i{background:var(--pb)}

.chk{width:44px;height:44px;border-radius:14px}
.step button{width:36px;height:44px}
.step input{width:48px}
.tk{padding:12px 12px 12px 14px;transition:transform .15s,opacity .2s;user-select:none;-webkit-user-select:none}
.tk.skip{opacity:.5}.tk.skip .t b{text-decoration:line-through;text-decoration-color:rgba(242,237,226,.4)}
.tk.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.lp-on{transform:scale(.985);opacity:.85}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#B48BFF,#8E5DE6 60%,#6F3FD6);border:1px solid rgba(255,255,255,.4);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.55),0 12px 30px rgba(0,0,0,.5)}
.fab svg{width:24px;height:24px}
@media(min-width:760px){.fab{right:calc(50% - 360px + 18px)}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 10px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button svg{color:var(--pb);flex:none}
.menu button.warn{color:var(--pb)}
.tbtn{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--pb);padding:4px 9px;border:1px solid rgba(196,164,255,.35);border-radius:20px;margin-top:6px;background:rgba(155,111,232,.1)}
.tbtn.run{color:var(--cb);border-color:rgba(94,224,238,.4);background:rgba(0,196,212,.1);box-shadow:0 0 12px rgba(0,196,212,.25)}
.timer{text-align:center;padding:10px 0}
.timer .big{font-family:var(--mono);font-size:64px;font-weight:500;letter-spacing:-2px;line-height:1;margin:14px 0 6px;text-shadow:0 0 30px rgba(155,111,232,.6)}
.timer .ringwrap{width:200px;height:200px;margin:0 auto;position:relative;filter:drop-shadow(0 0 16px rgba(155,111,232,.45))}
.timer .ringwrap .in{position:absolute;inset:0;display:grid;place-items:center}
.pace{font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin-top:5px}
.pace.ok{color:var(--cb)}.pace.lag{color:var(--pb)}.pace.n{color:var(--mut)}
.drag{width:28px;height:36px;display:grid;place-items:center;color:var(--dim);touch-action:none;cursor:grab;flex:none}
.rl .list-item.dragging{opacity:.35}
.ci{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

function nextMonday(){const d=new Date();const w=d.getDay();if(w!==1)d.setDate(d.getDate()+((8-w)%7||7));return iso(d)}

const APP={
S:null,tab:'home',sub:null,day:today(),wk:null,
sb:null,user:null,cloud:'off',

fresh(){return {v:2,profile:{name:''},sprint:{title:'12 недель',start:nextMonday(),weeks:12,threshold:85,vision:'',partner:''},goals:[],tactics:[],habits:[],log:{},hlog:{},lt:{},weeks:{},deals:[],del:[],archive:[],skip:{},checkin:{},pref:{group:'tod'},tasks:[],t:0}},

  if(this.user){clearTimeout(this._pt);this._pt=setTimeout(()=>this.push(),1200)}},

TOD:{m:'Утро',d:'День',e:'Вечер','':'В любое время'},

/* ---------- время спринта ---------- */
get st(){return this.S.sprint.start},
get W(){const s=this.S.sprint;return s.days?Math.ceil(s.days/7):(+s.weeks||12)},
end(){const s=this.S.sprint;return s.days?add(this.st,s.days-1):add(this.st,this.W*7-1)},
get mode(){return this.S.sprint.mode||'score'},
prog(){return PROGRAMS.find(p=>p.id===this.S.sprint.program)||null},
/* строгий / копилка: день выполнен, если закрыты все ежедневные тактики */
dayFull(d){if(!this.S.goals.length||d<this.st||d>this.end())return null;const w=this.weekOf(d);
  const ts=this.S.tactics.filter(t=>this.activeIn(t,w)&&t.type!=='ms'&&!this.skipped(t.id,d));if(!ts.length)return null;
  return ts.every(t=>{const v=this.v(t,d);return t.type==='check'?v>0:t.type==='num'?v>=(+t.per||1):v>0})},
strictRun(){let d=today(),n=0;if(this.dayFull(d)!==true)d=add(d,-1);while(d>=this.st){const f=this.dayFull(d);if(f===true)n++;else if(f===false)break;d=add(d,-1)}return n},
strictResets(){let n=0,d=this.st;const y=add(today(),-1);while(d<=y&&d<=this.end()){if(this.dayFull(d)===false)n++;d=add(d,1)}return n},
countDays(){let n=0,d=this.st;const t=today();while(d<=t&&d<=this.end()){if(this.dayFull(d)===true)n++;d=add(d,1)}return n},
sprintDays(){return this.S.sprint.days||this.W*7},
dayIndex(d){return diff(this.st,d)+1},
weekOf(d){return Math.floor(diff(this.st,d)/7)+1},
wDays(w){const s=add(this.st,(w-1)*7);return [0,1,2,3,4,5,6].map(i=>add(s,i))},
curWeek(){return Math.min(Math.max(this.weekOf(today()),1),this.W)},
clampDay(d){return d},

/* ---------- тактики и счёт ---------- */
goal(id){return this.S.goals.find(g=>g.id===id)},
gColor(id){const g=this.goal(id);return g?g.color:COLORS[0]},
msWeek(t){return t.deadline?Math.min(Math.max(this.weekOf(t.deadline),1),this.W):this.W},
activeIn(t,w){
  if(t.active===false)return false;
  if(t.type==='ms'){const dw=this.msWeek(t),done=this.msDoneDate(t);
    if(done&&this.weekOf(done)<dw)return w===Math.max(this.weekOf(done),1);return w===dw}
  if(t.dfrom||t.dto){const ds=this.wDays(w);if(!ds.some(d=>(!t.dfrom||d>=t.dfrom)&&(!t.dto||d<=t.dto)))return false}
  return w>=(+t.from||1)&&w<=(+t.to||this.W)},
v(t,d){const x=(this.S.log[d]||{})[t.id];return x==null?0:(x===true?1:+x||0)},
msDoneDate(t){let r=null;for(const d in this.S.log){if(this.S.log[d][t.id]&&(!r||d<r))r=d}return r},
frozen(d){return !!((this.S.skip||{})[d]||{}).__all},
skipped(id,d){const x=(this.S.skip||{})[d]||{};if(x.__all||x[id])return true;const t=this._tix&&this._tix[id];return !!(t&&((t.dfrom&&d<t.dfrom)||(t.dto&&d>t.dto)))},
setSkip(id,d,on){const K=this.S.skip=this.S.skip||{};this.stamp('S|'+d+'|'+id);K[d]=K[d]||{};if(on)K[d][id]=true;else delete K[d][id];if(!Object.keys(K[d]).length)delete K[d];this.save();this.render()},
skipsIn(t,w){return this.wDays(w).filter(d=>this.skipped(t.id,d)).length},
wTarget(t,w){const sk=w?this.skipsIn(t,w):0;
  return t.type==='check'?Math.max(1,Math.min(+t.target||1,7-sk)):t.type==='num'?(+t.per||1)*Math.max(1,Math.min(+t.days||7,7-sk)):t.type==='count'?(+t.target||1):1},
wVal(t,w){if(t.type==='ms')return this.msDoneDate(t)?1:0;return this.wDays(w).reduce((s,d)=>s+this.v(t,d),0)},
wDone(t,w){return this.wVal(t,w)>=this.wTarget(t,w)},
total(t){let s=0;for(const d in this.S.log){const x=this.S.log[d][t.id];if(x)s+=x===true?1:+x||0}return s},
score(w,gid){const ts=this.S.tactics.filter(t=>this.activeIn(t,w)&&(!gid||t.goal===gid));if(!ts.length)return null;
  return Math.round(ts.filter(t=>this.wDone(t,w)).length/ts.length*100)},
avg(gid){const w=this.curWeek(),a=[];for(let i=1;i<=w;i++){const s=this.score(i,gid);if(s!=null)a.push(s)}return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null},
dayPct(d){const w=this.weekOf(d);if(this.frozen(d))return 0;const ts=this.S.tactics.filter(t=>this.activeIn(t,w)&&(t.type==='check'||t.type==='num')&&!this.skipped(t.id,d));
  const cs=this.S.tactics.filter(t=>this.activeIn(t,w)&&t.type==='count'&&this.v(t,d)>0).length;
  if(!ts.length)return cs?1:0;let s=0;ts.forEach(t=>{s+=t.type==='check'?(this.v(t,d)?1:0):Math.min(this.v(t,d)/(+t.per||1),1)});
  return Math.min((s+cs)/ts.length,1)},
metricVal(m){if(m.auto==='paid')return this.S.deals.filter(x=>!x.lost&&x.stage>=4).length;
  if(m.auto&&m.auto.startsWith('t:')){const t=this.S.tactics.find(x=>x.id===m.auto.slice(2));return t?this.total(t):0}
  return +m.cur||0},
stamp(k){this.S.lt=this.S.lt||{};this.S.lt[k]=Date.now()},
setLog(tid,d,val){const L=this.S.log;this.stamp(d+'|'+tid);if(val)this.buzz(12);this._pop=tid;L[d]=L[d]||{};if(!val)delete L[d][tid];else L[d][tid]=val;if(!Object.keys(L[d]).length)delete L[d];this.save();this.render()},
toggle(tid,d){const t=this.S.tactics.find(x=>x.id===tid);this.setLog(tid,d,this.v(t,d)?0:true)},
inc(tid,d,n){const t=this.S.tactics.find(x=>x.id===tid);this.setLog(tid,d,Math.max(0,this.v(t,d)+n))},
setNum(tid,d,el){this.setLog(tid,d,Math.max(0,+el.value||0))},
toggleMs(tid,d){const t=this.S.tactics.find(x=>x.id===tid);
  if(this.msDoneDate(t)){for(const k in this.S.log)if(this.S.log[k][tid]){this.stamp(k+'|'+tid);delete this.S.log[k][tid];if(!Object.keys(this.S.log[k]).length)delete this.S.log[k]}this.save();this.render()}
  else this.setLog(tid,d,true)},

/* ---------- привычки ---------- */
hOn(h,d){return !!(this.S.hlog[d]||{})[h.id]},
hSched(h,d){return d>=h.created&&(h.days||[]).includes(pd(d).getDay())&&!this.skipped(h.id,d)},
hToggle(id,d){if(d>today())return;const L=this.S.hlog;this.stamp('H|'+d+'|'+id);L[d]=L[d]||{};if(L[d][id])delete L[d][id];else{L[d][id]=true;this.buzz(12);this._pop=id}if(!Object.keys(L[d]).length)delete L[d];this.save();this.render();if(this._hcal)this.hCal(id)},
/* универсальная серия: fn(d) — выполнено ли, sch(d) — запланировано ли */
streak(fn,sch,from){let d=today(),n=0,lim=400;if(!fn(d))d=add(d,-1);
  while(lim--&&d>=from){if(sch(d)){if(fn(d))n++;else break}d=add(d,-1)}return n},
best(fn,sch,from){let d=from,n=0,b=0;const t=today();while(d<=t){if(sch(d)){if(fn(d)){n++;b=Math.max(b,n)}else if(d<t)n=0}d=add(d,1)}return b},
rate(fn,sch,from,days){let a=0,b=0;for(let i=0;i<days;i++){const d=add(today(),-i);if(d<from)break;if(sch(d)){b++;if(fn(d))a++}}return b?Math.round(a/b*100):null},
hFns(h){return [d=>this.hOn(h,d),d=>this.hSched(h,d),h.created]},
tDaily(t){return t.active!==false&&(t.type==='check'||t.type==='num')},
tFns(t){return [d=>t.type==='check'?this.v(t,d)>0:this.v(t,d)>=(+t.per||1),d=>d>=this.st&&d<=this.end()&&this.activeIn(t,this.weekOf(d))&&!this.skipped(t.id,d),this.st]},
tHabitToggle(tid,d){if(d>today()||d<this.st)return;const t=this.S.tactics.find(x=>x.id===tid);
  if(t.type==='check')this.toggle(tid,d);else this.setLog(tid,d,this.v(t,d)>=(+t.per||1)?0:+t.per||1)},

/* ---------- навигация ---------- */
go(tab,sub){this.tab=tab;this.sub=sub||null;try{sessionStorage.setItem('tw-tab',tab)}catch(e){}window.scrollTo(0,0);this.render()},
openSub(sub){this.sub=sub;window.scrollTo(0,0);this.render()},
shiftDay(n){const d=add(this.day,n);if(d>add(today(),30))return;this.day=d;this.render()},
goDay(d){this.day=d;this.go('home')},
dash(html){const p=html.split('__S1__');if(p.length<2)return html;const head=p[0],rest=p[1].split('__S2__');const top=rest.length>1?rest[0]:'';const r2=(rest.length>1?rest[1]:rest[0]).split('__S3__');
  return `<div class="dhead">${head}</div><div class="dash"><div class="dtop">${top}</div><div class="dmain">${r2[0]}</div><div class="dbot">${r2[1]||''}</div></div>`},
simple(){return !!((this.S.pref||{}).simple)},
setSimple(v){this.S.pref=this.S.pref||{};this.S.pref.simple=!!v;this.save();if(v&&(this.tab==='habits'||this.tab==='goals'))this.tab='home';this.render()},
render(){
  this._tix=Object.fromEntries(this.S.tactics.map(t=>[t.id,t]));
  let body;
  if(this.simple()&&(this.tab==='habits'||this.tab==='goals'))this.tab='home';
  if(this.sub==='programs')body=this.vPrograms();
  else if(this.sub==='deals')body=this.vDeals();
  else body={home:this.vHome,habits:this.vHabits,goals:this.vGoals,week:this.vWeek,me:this.vMe}[this.tab].call(this);
  $('app').innerHTML=this.top()+this.dash(body);this.tr($('app'));
  const simple=this.simple();
  const tabs=simple?[['home','Главное',I.home],['week','Неделя',I.week],['me','Я',I.me]]:[['home','Главное',I.home],['habits','Привычки',I.habit],['goals','Программа',I.goal],['week','Неделя',I.week],['me','Я',I.me]];
  this._pop=null;
  $('nav').innerHTML='<div class="in">'+tabs.map(([k,l,ic])=>`<button class="${this.tab===k?'on':''}" onclick="APP.go('${k}')">${ic}<span>${l}</span></button>`).join('')+'</div>';
  const P=this.prog();
  $('snav').innerHTML=`<div class="sn-brand"><span class="sn-mark"></span><div><b>${esc(this.S.sprint.title||'12 недель')}</b><span>${P?esc(P.origin.split(',')[0]):'система достижения целей'}</span></div></div>
   <div class="sn-items">${tabs.map(([k,l,ic])=>`<button class="${this.tab===k&&!this.sub?'on':''}" onclick="APP.go('${k}')">${ic}<span>${l}</span></button>`).join('')}
   <button class="${this.sub==='programs'?'on':''}" onclick="APP.openSub('programs')">${I.goal}<span>Каталог программ</span></button></div>
   <div class="sn-foot" onclick="APP.go('me')"><span class="ava">${esc(this.initial())}</span><div class="sp"><b>${esc(this.S.profile.name||'Гость')}</b><span class="cloud ${this.cloud==='on'?'on':this.cloud==='err'?'err':''}"><i></i>${this.user?(this.cloud==='on'?'в облаке':this.cloud==='err'?'нет связи':'синхронизация'):'без аккаунта'}</span></div></div>`;
  this.tr($('nav'));this.tr($('snav'));
},
initial(){const n=(this.S.profile.name||(this.user&&this.user.email)||'').trim();return n?n[0].toUpperCase():'·'},
top(){return `<div class="top"><span></span>
  <button class="ava" onclick="APP.go('me')" aria-label="Личный кабинет">${esc(this.initial())}</button></div>`},
pl(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c},
dleft(d){const n=diff(today(),d);return n<0?`просрочено на ${-n} дн.`:n===0?'сегодня':`через ${n} дн.`},
ring(v,th,cap){const r=52,C=2*Math.PI*r,p=v==null?0:v/100,a=th/100*360-90,x=59+r*Math.cos(a*Math.PI/180),y=59+r*Math.sin(a*Math.PI/180);
  const col=v!=null&&v>=th?'url(#rc)':'url(#rg)';
  return `<div class="ring"><svg width="118" height="118"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4A4FF"/><stop offset="1" stop-color="#7C4FD4"/></linearGradient><linearGradient id="rc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FEBF5"/><stop offset="1" stop-color="#009BAB"/></linearGradient></defs><circle cx="59" cy="59" r="${r}" stroke="rgba(0,0,0,.45)" stroke-width="9" fill="none"/><circle cx="59" cy="59" r="${r}" stroke="rgba(255,255,255,.05)" stroke-width="9" fill="none"/>
   <circle cx="59" cy="59" r="${r}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 59 59)"/>
   <circle cx="${x}" cy="${y}" r="3.5" fill="var(--tx)"/></svg><div class="v"><div><b>${v??'—'}${v!=null?'%':''}</b><span>${cap||'ЦЕЛЬ '+th}</span></div></div></div>`},

/* ================= ГЛАВНОЕ ================= */
vHome(){
  const S=this.S,td=today();
  if(!S.goals.length&&!S.habits.length&&!(S.tasks||[]).length)return this.vOnboard();
  if(S.goals.length&&today()>this.end()&&!this._skipFinal)return this.vFinal();
  const inS=S.goals.length>0&&this.day>=this.st&&this.day<=this.end();
  const w=inS?this.weekOf(this.day):0,sc=inS?this.score(w):null,th=+S.sprint.threshold||85;
  const ts=inS?S.tactics.filter(t=>this.activeIn(t,w)):[];
  const nm=(S.profile.name||'').split(' ')[0],dd=pd(this.day);
  const dp=this.dayAll(this.day),hs0=S.habits.filter(x=>!x.archived),bestS=Math.max(0,...hs0.map(x=>{const[f,s_,fr]=this.hFns(x);return this.streak(f,s_,fr)}));
  const tk=this.tasksFor(this.day),tkDone=tk.filter(x=>x.done).length;
  let h=`<div class="lbl">${nm?'Привет, '+esc(nm)+' · ':''}${WDF[dd.getDay()]}, ${fd(this.day)}</div>
  <div class="h1">${this.day===td?'Сегодня':this.day===add(td,-1)?'Вчера':this.day===add(td,1)?'Завтра':WDF[dd.getDay()][0].toUpperCase()+WDF[dd.getDay()].slice(1)}</div>__S1__
  <div class="card hero" style="margin-top:16px">${this.ring(dp.n?Math.round(dp.p*100):null,100,'ДЕНЬ')}
    <div><div class="lbl">План дня</div>
      <div style="margin-top:6px;font-size:14px">${dp.n?(dp.left?`Осталось <b>${dp.left}</b> ${this.pl(dp.left,'дело','дела','дел')} из ${dp.n}`:'Всё на сегодня сделано.'):'На этот день ничего не запланировано.'}</div></div>
    <div class="kv" style="grid-column:1/-1;margin-top:0">
      <div><b>${dp.done}/${dp.n}</b><span>дел</span></div>
      <div><b>${bestS}</b><span>серия дн.</span></div>
      ${inS&&this.mode==='strict'?`<div onclick="APP.go('week')" style="cursor:pointer"><b>${this.strictRun()}</b><span>день подряд · из ${this.sprintDays()}</span></div>`:inS&&this.mode==='count'?`<div onclick="APP.go('week')" style="cursor:pointer"><b>${this.countDays()}/${this.sprintDays()}</b><span>дней в копилке</span></div>`:inS?`<div onclick="APP.wk=${w};APP.go('week')" style="cursor:pointer"><b>${sc??'—'}${sc!=null?'%':''}</b><span>неделя ${w}/${this.W}</span></div>`:`<div onclick="APP.go('goals')" style="cursor:pointer"><b>—</b><span>${S.goals.length?'вне спринта':'спринт'}</span></div>`}
    </div></div>`;
  if(inS&&this.mode==='strict'&&this.day===td&&this.dayFull(add(td,-1))===false&&this.dayIndex(td)>1)h+=`<div class="card small" style="border-color:rgba(196,164,255,.4)"><b>Вчера день не закрыт.</b> По правилам программы счётчик начался заново: сегодня день 1. Сбросов за программу: ${this.strictResets()}.</div>`;
  if(inS&&this.prog())h+=`<div class="row small mut" style="margin:2px 2px 0"><span class="dot" style="background:${this.prog().color}"></span><span class="sp">${esc(this.prog().name)} · день ${Math.max(1,this.dayIndex(this.day))} из ${this.sprintDays()}</span></div>`;
  if(!S.goals.length)h+=`<div class="card small mut">Привычки и задачи работают сами по себе. Когда будет готовность к программе — <button class="btn sm" style="margin-left:4px" onclick="APP._ob=null;APP.go('goals')">выбрать программу</button></div>`;
  else if(td<this.st)h+=`<div class="card small mut">Спринт начинается ${fd(this.st)}. Отмечать можно уже сейчас.</div>`;
  const wf=inS?(S.weeks[w]||{}).focus:'',ytop=((S.checkin||{})[add(this.day,-1)]||{}).top;
  h+=`<button class="quote" style="margin:14px 0;display:block;width:100%;text-align:left;${ytop?'':'opacity:.55'}" onclick="APP.editTop('${add(this.day,-1)}')"><span class="lbl" style="display:block;margin-bottom:2px">Главное на ${this.day===td?'сегодня':'этот день'}</span>${ytop?esc(ytop):'Задать одно дело, которое важнее остальных'}</button>`;
  if(inS)h+=`<button class="quote" style="margin:14px 0;display:block;width:100%;text-align:left;border-color:var(--cd);${wf?'':'opacity:.55'}" onclick="APP.editFocus(${w})"><span class="lbl" style="display:block;margin-bottom:2px">Фокус недели ${w}</span>${wf?esc(wf):'Одна фраза: что главное на этой неделе'}</button>`;
  const fz=this.frozen(this.day),grp=(S.pref||{}).group||'tod';
  h+=`__S2__<div class="daynav"><button onclick="APP.shiftDay(-1)">${I.l}</button>
    <button class="d" onclick="APP.dayMenu()"><b>${this.day===td?'Сегодня':WDF[dd.getDay()][0].toUpperCase()+WDF[dd.getDay()].slice(1)}</b><span class="lbl">${inS?'неделя '+w+' спринта':'вне спринта'}${fz?' · заморожен':''}</span></button>
    <button onclick="APP.shiftDay(1)">${I.r}</button></div>
`;
  if(fz)h+=`<div class="card frozen small"><b>День заморожен.</b> Отметки не обязательны, серии не прервутся, счёт недели пересчитан без этого дня. <button class="btn sm" style="margin-left:6px" onclick="APP.freeze('${this.day}',false)">Разморозить</button></div>`;
  const hs=S.habits.filter(x=>!x.archived&&(this.hSched(x,this.day)||this.hOn(x,this.day)));
  h+=this.tasksBlock(tk);
  if(grp==='goal'){
    S.goals.forEach(g=>{const gt=ts.filter(t=>t.goal===g.id);if(!gt.length)return;
      h+=`<div class="gh3"><span class="dot" style="background:${g.color}"></span><span class="lbl" style="color:var(--tx)">${esc(g.title)}</span><span class="sp"></span><span class="pill">${this.score(w,g.id)??'—'}%</span></div>`;
      gt.forEach(t=>h+=this.tRow(t,w))});
    if(hs.length){h+=`<div class="gh3"><span class="dot" style="background:var(--cb)"></span><span class="lbl" style="color:var(--tx)">Привычки</span><span class="sp"></span>${this.simple()?'':`<button class="pill" onclick="APP.go('habits')">все</button>`}</div>`;hs.forEach(x=>h+=this.hRow(x))}
  }else{
    const items=[...ts.map(t=>({k:'t',o:t,tod:t.tod||''})),...hs.map(x=>({k:'h',o:x,tod:x.tod||''}))];
    ['m','d','e',''].forEach(k=>{const it=items.filter(i=>i.tod===k);if(!it.length)return;
      h+=`<div class="todh"><span class="lbl">${this.TOD[k]}</span><span class="ln"></span></div>`;
      it.forEach(i=>h+=i.k==='t'?this.tRow(i.o,w,true):this.hRow(i.o))});
  }
  const ci=(S.checkin||{})[this.day];h+='__S3__';
  if(this.day<=td)h+=`<div class="card" style="margin-top:22px"><div class="row"><div class="sp"><div class="lbl">Вечерний чек-ин</div><div class="small mut" style="margin-top:4px">${ci?`Энергия ${ci.energy||'—'}/5 · сон ${ci.sleep||'—'} ч${ci.win?' · '+esc(ci.win):''}`:'60 секунд: энергия, сон, победа дня, главное на завтра'}</div></div>
    <button class="btn ${ci?'':'pr'} sm" onclick="APP.ciOpen('${this.day}')">${ci?'Изменить':'Закрыть день'}</button></div></div>`;
  return h;
},
setGroup(g){this.S.pref=this.S.pref||{};this.S.pref.group=g;this.save();this.render()},
hRow(x){const d=this.day,on=this.hOn(x,d),[f,s,fr]=this.hFns(x),st=this.streak(f,s,fr),sk=this.skipped(x.id,d)&&!this.frozen(d),g=((this.S.pref||{}).group||'tod')==='tod';
  return `<div class="tk ${on?'done':''} ${sk?'skip':''} ${this._pop===x.id?'pop':''}" data-lp="h:${x.id}"><div class="t" onclick="APP.editH('${x.id}')"><b>${g?'<span class="dot" style="display:inline-block;background:var(--cb);margin-right:8px;vertical-align:middle"></span>':''}${esc(x.title)}</b><div class="meta">${sk?'пропуск на этот день':st?'серия '+st+' дн.':'начни серию сегодня'}${x.when?' · '+esc(x.when):''}</div></div>
    <button class="chk ${on?'on':''}" onclick="APP.hToggle('${x.id}','${d}')">${on?I.ok:''}</button></div>`},
dayMenu(){const d=this.day,fz=this.frozen(d);
  this.open(`<div class="row"><div class="h2 sp">${fd(d)}</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div><div class="menu" style="margin-top:8px">
   <button onclick="APP.close();APP.freeze('${d}',${!fz})">${I.habit}<span>${fz?'Разморозить день':'Заморозить день'}<br><span class="small mut">Болезнь, перелёт, форс-мажор: серии не рвутся, счёт недели считается без этого дня. Осталось в этом месяце: ${this.frzLeft(d)} из ${this.frzLimit()}</span></span></button>
   <button onclick="APP.close();APP.ciOpen('${d}')">${I.ed}<span>Чек-ин за этот день</span></button>
   <button onclick="APP.close();APP.setGroup(((APP.S.pref||{}).group||'tod')==='tod'?'goal':'tod')">${I.goal}<span>${((this.S.pref||{}).group||'tod')==='tod'?'Группировать по целям':'Группировать по времени суток'}</span></button>
   <button onclick="APP.close();APP.day=today();APP.render()">${I.week}<span>К сегодняшнему дню</span></button></div>`)},
frzLimit(){const p=this.S.pref||{};return p.freezes==null?2:+p.freezes},
frzUsed(d){const m=d.slice(0,7),K=this.S.skip||{};return Object.keys(K).filter(x=>x.slice(0,7)===m&&K[x].__all).length},
frzLeft(d){return Math.max(0,this.frzLimit()-this.frzUsed(d))},
freeze(d,on){if(on&&this.mode==='strict')return this.toast('В строгой программе заморозок нет: пропуск — день 1 заново');if(on&&this.frzLeft(d)<=0)return this.toast(`Заморозки на ${MONF[pd(d).getMonth()].toLowerCase()} закончились: ${this.frzLimit()} из ${this.frzLimit()}`);
  const K=this.S.skip=this.S.skip||{};this.stamp('S|'+d+'|__all');K[d]=K[d]||{};if(on)K[d].__all=true;else delete K[d].__all;if(!Object.keys(K[d]).length)delete K[d];this.save();this.render();this.toast(on?'День заморожен':'День разморожен')},
lpMenu(k,id){const d=this.day;if(k==='k')return this.taskEdit(id);const o=k==='t'?this.S.tactics.find(x=>x.id===id):this.S.habits.find(x=>x.id===id);if(!o)return;
  const sk=this.skipped(id,d)&&!this.frozen(d);
  this.open(`<div class="row"><div class="h2 sp" style="font-size:17px">${esc(o.title)}</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div><div class="menu" style="margin-top:8px">
   <button onclick="APP.close();${k==='t'?`APP.editT('${id}')`:`APP.editH('${id}')`}">${I.ed}<span>Изменить</span></button>
   ${k==='t'&&o.type==='check'&&o.mins?`<button onclick="APP.close();APP.tmStart('${id}','${d}')">${I.week}<span>Таймер ${o.mins} мин</span></button>`:''}
   ${k==='h'?`<button onclick="APP.close();APP.hCal('${id}')">${I.week}<span>Календарь</span></button>`:''}
   <button onclick="APP.close();APP.setSkip('${id}','${d}',${!sk})">${I.habit}<span>${sk?'Вернуть в этот день':'Пропустить в этот день'}<br><span class="small mut">Не считается провалом и не рвёт серию</span></span></button>
   ${k==='h'?`<button class="warn" onclick="APP.close();APP.hArch('${id}',true)">${I.l}<span>В архив</span></button>`:`<button class="warn" onclick="APP.close();APP._t=JSON.parse(JSON.stringify(o));APP._t.active=!(o.active!==false);APP.tSave()">${I.l}<span>${o.active!==false?'Поставить на паузу':'Снять с паузы'}</span></button>`}
   </div>`)},
quickAdd(){this.open(`<div class="row"><div class="h2 sp">Добавить</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div><div class="menu" style="margin-top:8px">
   <button onclick="APP.close();const t=prompt('Задача на ${'${fd(APP.day)}'}');if(t)APP.taskAdd(t,APP.day)">${I.week}<span>Задачу на этот день</span></button>
   <button onclick="APP.close();APP.editH(null)">${I.habit}<span>Привычку</span></button>
   <button onclick="APP.close();APP.editT(null)">${I.goal}<span>Тактику в цель</span></button>
   <button onclick="APP.close();APP.editDeal(null)">${I.me}<span>Контакт в воронку</span></button>
   <button onclick="APP.close();APP.ciOpen(APP.day)">${I.ed}<span>Заметку и чек-ин дня</span></button></div>`)},

/* ---------- быстрая правка строк на главной ---------- */
editTop(prev){const c=((this.S.checkin||{})[prev])||{};
  this.open(`<div class="row"><div class="h2 sp" style="font-size:17px">Главное на день</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div>
  <div class="f"><input id="qT" value="${esc(c.top)}" placeholder="Одно дело, которое важнее остальных"></div>
  <div class="small mut">Это поле «главное на завтра» из вечернего чек-ина за ${fd(prev)}.</div>
  <button class="btn pr w" style="margin-top:14px" onclick="const v=$('qT').value.trim();APP.S.checkin=APP.S.checkin||{};APP.S.checkin['${prev}']=Object.assign({energy:0,sleep:'',win:'',note:''},APP.S.checkin['${prev}']||{},{top:v,t:Date.now()});APP.save();APP.close();APP.render()">Сохранить</button>`);setTimeout(()=>$('qT')&&$('qT').focus(),50)},
editFocus(w){const ws=this.S.weeks[w]||{};
  this.open(`<div class="row"><div class="h2 sp" style="font-size:17px">Фокус недели ${w}</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div>
  <div class="f"><input id="qF" value="${esc(ws.focus)}" placeholder="Одна фраза: что главное на этой неделе"></div>
  <div class="f"><label class="lbl">План недели</label><textarea id="qP" placeholder="Конкретика: кому касания, какие ролики, какие темы…">${esc(ws.plan)}</textarea></div>
  <button class="btn pr w" onclick="APP.setW(${w},'focus',$('qF').value.trim());APP.setW(${w},'plan',$('qP').value);APP.close();APP.render()">Сохранить</button>`);setTimeout(()=>$('qF')&&$('qF').focus(),50)},

/* ---------- задачи дня (разовые дела) ---------- */
tasksFor(d){const td=today();return (this.S.tasks||[]).filter(x=>x.date===d||(!x.done&&x.date<d&&d===td)).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.t||0)-(b.t||0))},
tasksBlock(tk){const d=this.day;
  let h=`<div class="todh"><span class="lbl">Задачи</span><span class="ln"></span></div>`;
  tk.forEach(x=>{const over=x.date<d;h+=`<div class="tk ${x.done?'done':''} ${this._pop===x.id?'pop':''}" data-lp="k:${x.id}"><div class="t" onclick="APP.taskEdit('${x.id}')"><b>${esc(x.title)}</b>${over?`<div class="meta">с ${fd(x.date)}</div>`:''}</div><button class="chk ${x.done?'on':''}" onclick="APP.taskToggle('${x.id}')">${x.done?I.ok:''}</button></div>`});
  h+=`<form class="row" style="margin:6px 0 2px" onsubmit="event.preventDefault();APP.taskAdd(this.q.value,'${d}');this.q.value=''"><input name="q" placeholder="Новая задача на этот день" autocomplete="off" style="flex:1"><button class="ic" type="submit" aria-label="Добавить">${I.plus}</button></form>`;
  return h},
taskAdd(title,d){title=(title||'').trim();if(!title)return;this.S.tasks=this.S.tasks||[];this.S.tasks.push({id:'k'+uid(),title,date:d||today(),done:'',t:Date.now()});this.save();this.render();this.buzz(8)},
taskToggle(id){const x=this.S.tasks.find(t=>t.id===id);if(!x)return;x.done=x.done?'':today();x.t=Date.now();if(x.done){this.buzz(12);this._pop=id}this.save();this.render()},
taskDel(id){this.S.del=[...(this.S.del||[]),id];this.S.tasks=this.S.tasks.filter(t=>t.id!==id);this.save();this.close();this.render()},
taskEdit(id){const x=this.S.tasks.find(t=>t.id===id);if(!x)return;
  this.open(`<div class="row"><div class="h2 sp">Задача</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div>
  <div class="f"><label class="lbl">Что сделать</label><input id="kT" value="${esc(x.title)}"></div>
  <div class="f"><label class="lbl">Дата</label><input id="kD" type="date" value="${x.date}"></div>
  <div class="row"><button class="btn pr sp" onclick="const x=APP.S.tasks.find(t=>t.id==='${id}');x.title=$('kT').value.trim()||x.title;x.date=$('kD').value||x.date;x.t=Date.now();APP.save();APP.close();APP.render()">Сохранить</button><button class="btn del" onclick="APP.taskDel('${id}')">Удалить</button></div>`)},
/* выполнение дня по всем делам: тактики, привычки, задачи */
dayAll(d){const w=this.S.goals.length&&d>=this.st&&d<=this.end()?this.weekOf(d):0;let n=0,done=0;
  if(w)this.S.tactics.filter(t=>this.activeIn(t,w)&&t.type!=='ms'&&!this.skipped(t.id,d)).forEach(t=>{n++;const v=this.v(t,d);if(t.type==='check'?v>0:t.type==='num'?v>=(+t.per||1):v>0)done++});
  this.S.habits.filter(x=>!x.archived&&this.hSched(x,d)).forEach(x=>{n++;if(this.hOn(x,d))done++});
  this.tasksFor(d).forEach(x=>{n++;if(x.done)done++});
  return {n,done,left:n-done,p:n?done/n:0}},

/* ---------- вечерний чек-ин ---------- */
ciOpen(d){const c=((this.S.checkin||{})[d])||{};this._ci=Object.assign({energy:0,sleep:'',win:'',top:'',note:''},c);this._cid=d;this.ciForm()},
ciForm(){const c=this._ci,d=this._cid;
  this.open(`<div class="row"><div class="h2 sp">Чек-ин · ${fd(d)}</div><button class="btn sm gh" onclick="APP.close()">Закрыть</button></div>
  <div class="f"><label class="lbl">Энергия за день</label><div class="ci">${[1,2,3,4,5].map(n=>`<button class="${c.energy===n?'on':''}" onclick="APP.ciKeep();APP._ci.energy=${n};APP.ciForm()">${n}</button>`).join('')}</div></div>
  <div class="f"><label class="lbl">Сон прошлой ночью, часов</label><input id="ciS" inputmode="decimal" value="${esc(c.sleep)}" placeholder="7.5"></div>
  <div class="f"><label class="lbl">Победа дня — одна строка</label><input id="ciW" value="${esc(c.win)}" placeholder="Что сегодня получилось"></div>
  <div class="f"><label class="lbl">Главное на завтра</label><input id="ciT" value="${esc(c.top)}" placeholder="Одно дело, которое важнее остальных"></div>
  <button class="btn pr w" onclick="APP.ciSave()">Сохранить</button>`)},
ciKeep(){const c=this._ci;if($('ciS')){c.sleep=$('ciS').value.replace(',','.');c.win=$('ciW').value;c.top=$('ciT').value}},
ciSave(){this.ciKeep();const c=this._ci;c.t=Date.now();this.S.checkin=this.S.checkin||{};this.S.checkin[this._cid]=c;this.save();this.close();this.buzz(20);this.render();this.toast('День закрыт')},
/* наблюдения: сон и энергия против выполнения дня */
observations(){const C=this.S.checkin||{},rows=Object.keys(C).filter(d=>d>=this.st&&d<=today());
  const out=[];if(rows.length<10)return {n:rows.length,out};
  const pct=d=>Math.round(this.dayPct(d)*100);
  const split=(name,test,hi,lo)=>{const a=rows.filter(test),b=rows.filter(d=>!test(d));if(a.length<3||b.length<3)return;
    const ma=Math.round(a.reduce((s,d)=>s+pct(d),0)/a.length),mb=Math.round(b.reduce((s,d)=>s+pct(d),0)/b.length);
    out.push(`${name}: в дни ${hi} выполнение дня <b>${ma}%</b>, в дни ${lo} — <b>${mb}%</b> (${a.length} и ${b.length} дн.)`)};
  split('Сон',d=>+C[d].sleep>=7,'с 7+ ч сна','с меньшим сном');
  split('Энергия',d=>+C[d].energy>=4,'с энергией 4–5','с энергией 1–3');
  const sl=rows.map(d=>+C[d].sleep).filter(x=>x>0);if(sl.length)out.push(`Средний сон: <b>${(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)} ч</b> за ${sl.length} дн.`);
  return {n:rows.length,out}},

/* ---------- таймер ---------- */
loadTm(){try{const t=JSON.parse(localStorage.getItem('tw-tm'));return t&&t.end>Date.now()?t:null}catch(e){return null}},
tmStart(tid,d){const t=this.S.tactics.find(x=>x.id===tid);if(!t||!t.mins)return;this.tm={tid,d,end:Date.now()+t.mins*60000,total:t.mins*60000};localStorage.setItem('tw-tm',JSON.stringify(this.tm));this.tmOpen()},
tmOpen(){const tm=this.tm;if(!tm)return;const t=this.S.tactics.find(x=>x.id===tm.tid);
  this.open(`<div class="row"><div class="h2 sp" style="font-size:17px">${esc(t?t.title:'Таймер')}</div><button class="btn sm gh" onclick="APP.close()">Свернуть</button></div>
   <div class="timer"><div class="ringwrap"><svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" stroke="rgba(0,0,0,.45)" stroke-width="10" fill="none"/><circle id="tmArc" cx="100" cy="100" r="88" stroke="url(#rg)" stroke-width="10" fill="none" stroke-linecap="round" transform="rotate(-90 100 100)"/></svg><div class="in"><div class="big" id="tmBig">--:--</div></div></div>
   <div class="small mut">Можно свернуть: таймер продолжит идти, по окончании отметка поставится сама.</div>
   <div class="row" style="margin-top:18px;justify-content:center"><button class="btn pr" onclick="APP.tmFinish(true)">Готово раньше</button><button class="btn gh" onclick="APP.tmFinish(false)">Отменить</button></div></div>`);
  this.tmTick()},
tmTick(){clearInterval(this._tmi);const tm=this.tm;if(!tm)return;
  const step=()=>{const left=tm.end-Date.now();if(left<=0){clearInterval(this._tmi);return this.tmFinish(true)}
    const b=$('tmBig'),a=$('tmArc');if(b){const s=Math.ceil(left/1000);b.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}
    if(a){const C=2*Math.PI*88;a.setAttribute('stroke-dasharray',(C*(left/tm.total))+' '+C)}
    const btn=document.querySelector('.tbtn.run');if(btn){const s=Math.ceil(left/1000);btn.textContent='● '+pad(Math.floor(s/60))+':'+pad(s%60)}};
  step();this._tmi=setInterval(step,1000)},
tmFinish(done){clearInterval(this._tmi);const tm=this.tm;this.tm=null;localStorage.removeItem('tw-tm');if(!tm)return;
  if(done){const t=this.S.tactics.find(x=>x.id===tm.tid);if(t&&!this.v(t,tm.d))this.setLog(tm.tid,tm.d,true);this.buzz([30,60,30]);this.toast('Время вышло — отмечено')}
  if($('modal').classList.contains('on')&&$('tmBig'))this.close();this.render()},

/* ---------- темп (Strides) ---------- */
pace(actual,target,start){const td=today(),total=this.W*7,el=Math.max(0,Math.min(diff(this.st,td)+1,total));
  if(!target||el<=0||actual>=target)return actual>=target&&target?{cls:'ok',txt:'цель достигнута'}:null;
  const exp=Math.round((target-(start||0))*el/total)+(start||0),dl=actual-exp,wl=Math.max((total-el)/7,.15),need=Math.ceil((target-actual)/wl);
  const fc=Math.round((start||0)+(actual-(start||0))*total/el);
  if(el<7)return {cls:'n',txt:'разгон · нужно '+need+' в нед.'};
  const cls=dl>=0?'ok':(dl>-(target-(start||0))*.08?'n':'lag');
  return {cls,txt:(dl>0?'опережение +'+dl:dl<0?'отставание '+dl:'в графике')+' · нужно '+need+' в нед. · прогноз '+fc}},

/* ---------- перетаскивание ---------- */
initDrag(){const app=$('app');let drag=null;
  app.addEventListener('pointerdown',e=>{const hnd=e.target.closest('.drag');if(!hnd)return;const item=hnd.closest('.list-item,.hb'),list=item&&item.closest('.rl');if(!list)return;
    e.preventDefault();hnd.setPointerCapture(e.pointerId);drag={item,list,y:e.clientY};item.classList.add('dragging')});
  app.addEventListener('pointermove',e=>{if(!drag)return;const sib=[...drag.list.querySelectorAll(':scope > .list-item, :scope > .hb')];
    for(const s of sib){if(s===drag.item)continue;const r=s.getBoundingClientRect();
      if(e.clientY<r.top+r.height/2&&s.compareDocumentPosition(drag.item)&Node.DOCUMENT_POSITION_FOLLOWING){drag.list.insertBefore(drag.item,s);break}
      if(e.clientY>r.top+r.height/2&&s.compareDocumentPosition(drag.item)&Node.DOCUMENT_POSITION_PRECEDING){drag.list.insertBefore(drag.item,s.nextSibling);break}}});
  const end=()=>{if(!drag)return;drag.item.classList.remove('dragging');const ids=[...drag.list.querySelectorAll(':scope > .list-item, :scope > .hb')].map(x=>x.dataset.id);
    const kind=drag.list.dataset.rl;drag=null;this.reorder(kind,ids)};
  app.addEventListener('pointerup',end);app.addEventListener('pointercancel',end)},
reorder(kind,ids){const S=this.S;
  if(kind==='habits'){const m=new Map(S.habits.map(h=>[h.id,h]));const rest=S.habits.filter(h=>!ids.includes(h.id));S.habits=[...ids.map(i=>m.get(i)).filter(Boolean),...rest]}
  else{const gid=kind.slice(2);const m=new Map(S.tactics.map(t=>[t.id,t]));const out=[];let placed=false;
    S.tactics.forEach(t=>{if(t.goal!==gid)return out.push(t);if(!placed){placed=true;ids.forEach(i=>{const x=m.get(i);if(x)out.push(x)})}});
    S.tactics=out}
  this.save();this.buzz(8);this.render()},
tRow(t,w,showGoal){
  const d=this.day,val=this.v(t,d),wv=this.wVal(t,w),wt=this.wTarget(t,w),done=wv>=wt,sk=this.skipped(t.id,d)&&!this.frozen(d);
  let ctl='',meta='';
  if(t.type==='check'){ctl=`<button class="chk ${val?'on':''}" onclick="APP.toggle('${t.id}','${d}')">${val?I.ok:''}</button>`;meta=`${wv}/${wt} дн.`}
  else if(t.type==='num'){ctl=`<div class="step"><button onclick="APP.inc('${t.id}','${d}',-1)">−</button><input inputmode="numeric" value="${val||''}" placeholder="0" onchange="APP.setNum('${t.id}','${d}',this)"><button onclick="APP.inc('${t.id}','${d}',${+t.per||1})">+</button></div>`;
    meta=`${val}/${t.per} ${esc(t.unit)} · неделя ${wv}/${wt}`}
  else if(t.type==='count'){ctl=`<div class="step"><button onclick="APP.inc('${t.id}','${d}',-1)">−</button><input inputmode="numeric" value="${val||''}" placeholder="0" onchange="APP.setNum('${t.id}','${d}',this)"><button onclick="APP.inc('${t.id}','${d}',1)">+</button></div>`;
    meta=`${wv}/${wt} на неделе`}
  else{const dd=this.msDoneDate(t);ctl=`<button class="chk ${dd?'on':''}" onclick="APP.toggleMs('${t.id}','${d}')">${dd?I.ok:''}</button>`;
    meta=dd?`сделано ${fd(dd)}`:(t.deadline?`дедлайн ${fd(t.deadline)} · ${this.dleft(t.deadline)}`:'веха')}

  if(sk)meta='пропуск на этот день · '+meta;
  let hint='';
  if(t.type==='check'&&!val&&!sk&&d>this.st&&!this.v(t,add(d,-1))&&!this.skipped(t.id,add(d,-1)))hint=`Вчера пропущено. Не пропускай дважды${t.min?': минимум — '+esc(t.min):''}`;
  let tb='';if(t.type==='check'&&t.mins&&!val){const run=this.tm&&this.tm.tid===t.id;tb=`<button class="tbtn ${run?'run':''}" onclick="event.stopPropagation();${run?'APP.tmOpen()':`APP.tmStart('${t.id}','${d}')`}">${run?'● идёт':'▶ '+t.mins+' мин'}</button>`}
  const dot=showGoal?`<span class="dot" style="display:inline-block;background:${this.gColor(t.goal)};margin-right:8px;vertical-align:middle"></span>`:'';
  return `<div class="tk ${done?'done':''} ${sk?'skip':''} ${this._pop===t.id?'pop':''}" data-lp="t:${t.id}"><div class="t" onclick="APP.editT('${t.id}')"><b>${dot}${esc(t.title)}</b><div class="meta">${meta}</div>
    <div class="bar ${done?'c':''}"><i style="width:${Math.min(wv/wt,1)*100}%"></i></div>${hint?`<div class="hint">${hint}</div>`:''}${tb}</div>${ctl}</div>`;
},

   ${o.own.map((g,i)=>`<div class="card" style="border-color:rgba(196,164,255,.6)"><div class="row"><span style="font-family:var(--mono);color:var(--pb);font-size:18px">+</span><b class="sp">${esc(g.title)}</b><button class="btn sm gh" onclick="APP._ob.own.splice(${i},1);APP.render()">Убрать</button></div><div class="small mut" style="margin-top:4px">${esc(g.result)}</div></div>`).join('')}

obBuild(){const o=this._ob;const P=PROGRAMS.find(x=>x.id===o.prog);const key=(o.prog||'')+'|'+o.pick.join(',')+'|'+o.own.length;if(o.goals&&o.built===key)return;
  o.goals=[];o.tactics=[];let ci=0;
  if(P&&P.tactics&&P.tactics.length){const gid=uid();o.goals.push({id:gid,title:P.name,result:P.rules.join('. '),color:P.color,date:'',woop:{},metrics:[]});
    P.tactics.forEach(([title,type,x])=>o.tactics.push(Object.assign(T(gid,title,type,Object.assign({target:7},x)),{on:true})));o.built=key;return}
  o.pick.forEach(id=>{const t=TPL.find(x=>x.id===id),gid=uid();o.goals.push({id:gid,title:t.name,result:t.result,color:t.color,date:'',woop:{},metrics:t.metrics.map(m=>Object.assign({id:uid(),start:0,cur:0},m))});
    t.tactics.forEach(([title,type,x])=>{const ex=Object.assign({},x);if(ex.week){ex.deadline=add(o.start,ex.week*7-1);delete ex.week}o.tactics.push(Object.assign(T(gid,title,type,ex),{on:true}))})});
  o.own.forEach(g=>{o.goals.push({id:uid(),title:g.title,result:g.result,color:COLORS[(ci++)%COLORS.length],date:'',woop:{},metrics:[]})});
  o.built=key},

vHabits(){

  const doneToday=hs.filter(x=>this.hSched(x,td)&&this.hOn(x,td)).length,schToday=hs.filter(x=>this.hSched(x,td)).length;
  const allRows=[...hs.map(x=>({k:'h',o:x})),...S.tactics.filter(t=>this.tDaily(t)).map(t=>({k:'t',o:t}))];
  const dayP=d=>{let a=0,b=0;allRows.forEach(r=>{const[f,sc]=r.k==='h'?this.hFns(r.o):this.tFns(r.o);if(sc(d)){b++;if(f(d))a++}});return b?a/b:null};

  const wk=(off)=>{const m=add(mon,-7*off);let a=0,b=0;for(let i=0;i<7;i++){const d=add(m,i);if(d>td)break;const p=dayP(d);if(p!=null){a+=p;b++}}return b?Math.round(a/b*100):null};

     <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:84px;margin-top:8px;overflow:visible"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00C4D4" stop-opacity=".45"/><stop offset="1" stop-color="#00C4D4" stop-opacity="0"/></linearGradient></defs>
     ${area?`<path d="${area}" fill="url(#tg)"/>`:''}${path?`<path d="${path}" fill="none" stroke="#5EE0EE" stroke-width="1.4" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 6px rgba(0,196,212,.8))"/>`:''}

  h+=`<div class="rl" data-rl="habits">`;hs.forEach(x=>h+=this.hCard(x,days,'h'));h+=`</div>`;

  if(streaks.length>1){const byRate=[...streaks].filter(x=>x.rate!=null).sort((a,b)=>b.rate-a.rate).slice(0,6),bySt=[...streaks].sort((a,b)=>b.st-a.st).slice(0,6);
    const bar=(label,val,max,txt,col)=>`<div style="margin:9px 0"><div class="row small"><span class="sp" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${label}</span><b style="font-family:var(--mono);font-size:12px;color:${col}">${txt}</b></div><div class="bar ${col==='var(--cb)'?'c':''}"><i style="width:${max?Math.round(val/max*100):0}%"></i></div></div>`;

    ms.forEach(m=>{const v=this.metricVal(m),s=+m.start||0,tg=+m.target||0;const p=tg===s?(v===tg?1:0):Math.max(0,Math.min((v-s)/(tg-s),1));

    tot.forEach(t=>{const v=this.total(t),pc=this.pace(v,t.total,0);h+=`<div style="margin-top:14px"><div class="row small"><span class="sp">${esc(t.title)}, всего</span><b>${v}</b><span class="mut">/ ${t.total}</span></div><div class="bar"><i style="width:${Math.min(v/t.total,1)*100}%"></i></div>${pc?`<div class="pace ${pc.cls}">${pc.txt}</div>`:''}</div>`});

   <button class="btn gh w" style="margin-top:8px" onclick="APP.openSub('programs')">Каталог программ ${I.r}</button>

},

  ${this.groupCard()}

setW(w,k,v){this.S.weeks[w]=this.S.weeks[w]||{};this.S.weeks[w][k]=v;this.save();if(this.simple()&&(k==='commit'||k==='worked')&&v&&String(v).trim()){this.setSimple(false);this.toast('Первый разбор сделан — открыты «Программа» и «Привычки»')}},
report(w){const S=this.S,ws=S.weeks[w]||{},ds=this.wDays(w),ts=S.tactics.filter(t=>this.activeIn(t,w));
  let r=`${S.sprint.title} · неделя ${w}/${this.W} (${fd(ds[0])}–${fd(ds[6])})\nСчёт: ${this.score(w)??'—'}% при цели ${S.sprint.threshold}%\n`;
  S.goals.forEach(g=>r+=`• ${g.title}: ${this.score(w,g.id)??'—'}%\n`);
  const miss=ts.filter(t=>!this.wDone(t,w));if(miss.length)r+=`\nНе закрыто: ${miss.map(t=>`${t.title} (${this.wVal(t,w)}/${this.wTarget(t,w)})`).join('; ')}\n`;
  if(ws.worked)r+=`\nСработало: ${ws.worked}`;if(ws.blocked)r+=`\nПомешало: ${ws.blocked}`;if(ws.commit)r+=`\nНа следующую неделю: ${ws.commit}`;
  return r.trim()},
monthBlock(w){const S=this.S,k='m'+Math.ceil(w/4),M=S.weeks[k]||{},ws=[];for(let i=Math.max(1,w-3);i<=w;i++)ws.push(i);
  const av=a=>{const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null};

   <div style="grid-column:1/-1">${S.goals.flatMap(g=>(g.metrics||[]).map(m=>{const v=this.metricVal(m);return `<div class="row small" style="margin:4px 0"><span class="sp mut">${esc(m.name)}</span><b>${v}</b><span class="mut">/ ${m.target} ${esc(m.unit)}</span></div>`})).join('')}</div></div>

  return h},
aiReport(w){const S=this.S,ds=this.wDays(w),ts=S.tactics.filter(t=>this.activeIn(t,w)),C=S.checkin||{};
  let r=`Разбери мою неделю как партнёр по системе «12 недель в году» (Моран): коротко, прямо, без похвалы ради похвалы. Нужно: 1) что реально двигало цели, а что было имитацией; 2) где я избегаю главную задачу; 3) один конкретный шаг на следующую неделю. Данные:\n\n`;
  r+=`Спринт «${S.sprint.title}», неделя ${w} из ${this.W} (${fd(ds[0])}–${fd(ds[6])}). Планка ${S.sprint.threshold}%. Счёт недели ${this.score(w)??'—'}%, средний по спринту ${this.avg()??'—'}%.\n`;
  if(S.sprint.vision)r+=`Видение: ${S.sprint.vision}\n`;
  S.goals.forEach(g=>{r+=`\nЦЕЛЬ «${g.title}» (${this.score(w,g.id)??'—'}%): ${g.result}\n`;
    (g.metrics||[]).forEach(m=>{const pc=this.pace(this.metricVal(m),+m.target,+m.start);r+=`  метрика ${m.name}: ${this.metricVal(m)}/${m.target} ${m.unit||''}${pc?' · '+pc.txt:''}\n`});
    ts.filter(t=>t.goal===g.id).forEach(t=>{const days=ds.map(d=>{const v=this.v(t,d);return this.skipped(t.id,d)?'–':v===0?'0':String(v===true?1:v)}).join(' ');
      r+=`  ${this.wDone(t,w)?'✓':'✗'} ${t.title}: ${this.wVal(t,w)}/${this.wTarget(t,w)} [пн–вс: ${days}]${t.ifthen?' · если-то: '+t.ifthen:''}\n`})});
  const hs=S.habits.filter(x=>!x.archived);if(hs.length){r+=`\nПРИВЫЧКИ: `+hs.map(x=>{const[f,s_,fr]=this.hFns(x);return `${x.title} — серия ${this.streak(f,s_,fr)}, за неделю ${ds.filter(d=>f(d)).length}/${ds.filter(d=>s_(d)).length}`}).join('; ')+'\n'}
  const cs=ds.filter(d=>C[d]);if(cs.length){r+=`\nЧЕК-ИНЫ:\n`;cs.forEach(d=>{const c=C[d];r+=`  ${fd(d)}: энергия ${c.energy||'—'}/5, сон ${c.sleep||'—'} ч${c.win?', победа: '+c.win:''}${c.top?', главное на завтра: '+c.top:''}${c.note?', заметка: '+c.note:''}\n`})}
  const fz=ds.filter(d=>this.frozen(d));if(fz.length)r+=`\nЗаморожены дни: ${fz.map(fd).join(', ')}\n`;
  const tk=(S.tasks||[]).filter(x=>ds.includes(x.date));if(tk.length)r+=`\nЗАДАЧИ НЕДЕЛИ: ${tk.map(x=>(x.done?'✓ ':'✗ ')+x.title).join('; ')}\n`;
  const ws=S.weeks[w]||{};if(ws.focus)r+=`\nФокус недели: ${ws.focus}`;if(ws.plan)r+=`\nПлан недели: ${ws.plan}`;if(ws.worked)r+=`\nМой разбор — сработало: ${ws.worked}`;if(ws.blocked)r+=`\nПомешало: ${ws.blocked}`;if(ws.commit)r+=`\nОбещаю: ${ws.commit}`;
  const dl=S.deals||[];if(dl.length)r+=`\n\nВОРОНКА: всего контактов ${dl.length}, созвонов ${dl.filter(x=>(x.max??x.stage)>=1).length}, офферов ${dl.filter(x=>(x.max??x.stage)>=2).length}, оплат ${dl.filter(x=>!x.lost&&x.stage>=4).length}`;
  return r},
async copyAI(w){const r=this.aiReport(w);try{await navigator.clipboard.writeText(r);this.toast('Скопировано — вставь в чат с Claude')}catch(e){this.open(`<div class="lbl">Разбор с Claude</div><textarea style="min-height:300px;margin-top:10px" onclick="this.select()">${esc(r)}</textarea><button class="btn" style="margin-top:12px" onclick="APP.close()">Закрыть</button>`)}},

    new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{const key=pre+d+'|'+k,ta=(lta||{})[key]||0,tb=(ltb||{})[key]||0;let v;

  m.lt=Object.assign({},a.lt||{});for(const k in b.lt||{})m.lt[k]=Math.max(m.lt[k]||0,b.lt[k]);
  m.log=this.mergeLog(a.log,b.log,a.lt,b.lt,'');m.hlog=this.mergeLog(a.hlog,b.hlog,a.lt,b.lt,'H|');m.skip=this.mergeLog(a.skip,b.skip,a.lt,b.lt,'S|');
  m.checkin=Object.assign({},a.checkin||{});for(const d in b.checkin||{})if(!m.checkin[d]||(b.checkin[d].t||0)>(m.checkin[d].t||0))m.checkin[d]=b.checkin[d];
  m.pref=Object.assign({},old.pref||{},nw.pref||{});
  const km=new Map();[...(a.tasks||[]),...(b.tasks||[])].forEach(x=>{if(m.del.includes(x.id))return;const p=km.get(x.id);if(!p||(x.t||0)>(p.t||0))km.set(x.id,x)});m.tasks=[...km.values()];
  m.weeks=Object.assign({},old.weeks||{});for(const w in nw.weeks||{})m.weeks[w]=Object.assign({},(old.weeks||{})[w]||{},nw.weeks[w]);
  m.del=[...new Set([...(a.del||[]),...(b.del||[])])];
  const dm=new Map();[...(a.deals||[]),...(b.deals||[])].forEach(d=>{if(m.del.includes(d.id))return;const p=dm.get(d.id);if(!p||(d.upd||0)>(p.upd||0))dm.set(d.id,d)});
  m.deals=[...dm.values()];
  return m;
},

/* ---------- шаблон по ссылке ---------- */
async b64e(o){const raw=new TextEncoder().encode(JSON.stringify(o,(k,v)=>v===''||v===0&&k!=='start'&&k!=='cur'?undefined:v));
  const buf=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let b='';buf.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
async b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text())},
async tplLink(){const S=this.S;const tpl={sprint:{title:S.sprint.title,start:S.sprint.start,weeks:S.sprint.weeks,days:S.sprint.days,program:S.sprint.program,mode:S.sprint.mode,threshold:S.sprint.threshold},
  goals:S.goals.map(g=>Object.assign({},g,{metrics:(g.metrics||[]).map(m=>Object.assign({},m,{cur:m.start}))})),tactics:S.tactics,
  habits:S.habits.filter(h=>!h.archived).map(h=>({id:h.id,title:h.title,days:h.days,when:h.when,tod:h.tod})),weeks:{}};
  for(const w in S.weeks)if(S.weeks[w].focus)tpl.weeks[w]={focus:S.weeks[w].focus};
  return location.origin+location.pathname+'#tpl='+await this.b64e(tpl)},
async applyTpl(s){let t;try{t=await this.b64d(s)}catch(e){return this.toast('Ссылка-шаблон повреждена')}
  if(!t||!t.goals)return;
  if(this.S.goals.length&&!confirm('Заменить текущие цели и тактики целями из ссылки?'))return;
  Object.assign(this.S.sprint,t.sprint||{});this.S.goals=t.goals;this.S.tactics=t.tactics||[];
  this.S.tactics.forEach(x=>{['target','per','from'].forEach(k=>{if(x[k]==null)x[k]=1});if(x.days==null)x.days=7;['to','total'].forEach(k=>{if(x[k]==null)x[k]=0});['unit','deadline','when','ifthen','min'].forEach(k=>{if(x[k]==null)x[k]=''});if(x.active==null)x.active=true});
  this.S.goals.forEach(g=>{g.woop=g.woop||{};g.metrics=(g.metrics||[]).map(m=>Object.assign({start:0,target:0,cur:0,unit:'',auto:''},m))});
  const have=new Set(this.S.habits.map(h=>h.title));(t.habits||[]).forEach(h=>{if(!have.has(h.title))this.S.habits.push(H(h.title,{id:h.id||'h'+uid(),days:h.days||[0,1,2,3,4,5,6],when:h.when||'',tod:h.tod||''}))});
  this.S.weeks=Object.assign({},t.weeks||{},this.S.weeks);this.day=this.clampDay(today());this.save();this.tab='home';this.render();this.toast('Шаблон установлен')}
};
